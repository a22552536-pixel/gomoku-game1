<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>看山似山</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--paper:#ebe4d4;--ink:#4a4436;--seal:#a8453a;color-scheme:light}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper)}
  canvas{display:block;width:100%;height:100%;cursor:none;touch-action:none}
  .ui{position:fixed;font-family:'Noto Serif TC','Songti TC','PMingLiU',serif;font-weight:300;
      user-select:none;transition:color 1.6s ease,opacity 1.4s ease;color:var(--ink)}
  #title{top:32px;left:34px;writing-mode:vertical-rl;font-size:14px;letter-spacing:.5em;opacity:.62;pointer-events:none;
         display:flex;align-items:center;gap:12px}
  #title i{font-style:normal;writing-mode:horizontal-tb;display:inline-grid;place-items:center;width:17px;height:17px;
           background:var(--seal);color:var(--paper);font-size:10px;letter-spacing:0;border-radius:2px;opacity:.85}
  #guide{left:0;right:0;bottom:40px;display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;pointer-events:none}
  #hint{font-size:14px;letter-spacing:.46em;padding-left:.46em}
  #drip{position:relative;width:1px;height:34px;background:currentColor;opacity:.28}
  #drip::after{content:"";position:absolute;left:-2px;top:0;width:5px;height:5px;border-radius:50%;background:currentColor;
               animation:drip 2.6s cubic-bezier(.5,0,.6,1) infinite}
  @keyframes drip{0%{transform:translateY(-4px);opacity:0}25%{opacity:1}85%{opacity:1}100%{transform:translateY(32px);opacity:0}}
  #guide.draw #drip{display:none}
  #snd{right:28px;bottom:28px;font-size:13px;letter-spacing:.2em;opacity:.42;cursor:pointer;background:none;border:0;padding:8px}
  #snd:hover,#snd:focus-visible{opacity:.9;outline:none}
  #snd.off{text-decoration:line-through}
  @media (prefers-reduced-motion: reduce){#drip::after{animation:none;top:14px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title" class="ui">看山似山<i>山</i></div>
<div id="guide" class="ui draw"><div id="hint"></div><div id="drip"></div></div>
<button id="snd" class="ui" title="聲音（M）">聲</button>
<script>
(() => {
'use strict';

/* ════════════ 工具 ════════════ */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hash1 = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const vnoise = x => { const i = Math.floor(x), f = x - i; return lerp(hash1(i), hash1(i + 1), f * f * (3 - 2 * f)); };
const fbm = (x, s) => 0.55 * vnoise(x + s) + 0.3 * vnoise(x * 2.3 + s * 1.7) + 0.15 * vnoise(x * 5.1 + s * 3.1);
const gauss = r => Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(TAU * r());
const wrapU = u => ((u + 1) % 2 + 2) % 2 - 1;
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

/* 相似變換 z → m·z + t，陣列 [mr, mi, tx, ty] */
const mul = (A, B) => [
  A[0] * B[0] - A[1] * B[1], A[0] * B[1] + A[1] * B[0],
  A[0] * B[2] - A[1] * B[3] + A[2], A[1] * B[2] + A[0] * B[3] + A[3]];
const inv = S => {
  const d = S[0] * S[0] + S[1] * S[1], a = S[0] / d, b = -S[1] / d;
  return [a, b, -(a * S[2] - b * S[3]), -(b * S[2] + a * S[3])];
};
const app = (S, x, y) => [S[0] * x - S[1] * y + S[2], S[1] * x + S[0] * y + S[3]];
const setT = (c, S) => c.setTransform(S[0], S[1], -S[1], S[0], S[2], S[3]);
const simFrom = (cx, cy, th, K) => [Math.cos(th) / K, Math.sin(th) / K, cx, cy];
/* 門戶 T 把上一層整個畫面放進下一層；鏡頭沿 T 的不動點做對數縮放 */
function camOf(T, t) {
  const mr = T[0], mi = T[1];
  const dr = 1 - mr, di = -mi, dd = dr * dr + di * di;
  const Fr = (T[2] * dr + T[3] * di) / dd, Fi = (T[3] * dr - T[2] * di) / dd;
  const e = -(1 - t);
  const wm = Math.pow(Math.hypot(mr, mi), e), wa = Math.atan2(mi, mr) * e;
  const wr = wm * Math.cos(wa), wi = wm * Math.sin(wa);
  return [wr, wi, Fr - (wr * Fr - wi * Fi), Fi - (wr * Fi + wi * Fr)];
}

/* ════════════ 畫布與紋理 ════════════ */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'), octx = off.getContext('2d');
let W, H, DPR, ASP, BASE, RS = 1;

function canvasOf(s, fn) { const c = document.createElement('canvas'); c.width = c.height = s; fn(c.getContext('2d'), s); return c; }
const paperImg = canvasOf(384, (x, s) => {
  const r = rng(7);
  x.fillStyle = '#ebe4d4'; x.fillRect(0, 0, s, s);
  const img = x.getImageData(0, 0, s, s), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 12; d[i] += n; d[i + 1] += n; d[i + 2] += n * 0.8; }
  x.putImageData(img, 0, 0);
  for (let i = 0; i < 90; i++) {
    x.strokeStyle = `rgba(120,100,70,${0.025 + r() * 0.04})`; x.lineWidth = 0.6;
    const px = r() * s, py = r() * s, a = r() * TAU, l = 6 + r() * 26;
    x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a) * l * 0.5 + r() * 4, py + Math.sin(a) * l * 0.5, px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke();
  }
});
const grainImg = canvasOf(256, (x, s) => {
  const img = x.createImageData(s, s), d = img.data, r = rng(3);
  for (let i = 0; i < d.length; i += 4) { const v = r() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 20; }
  x.putImageData(img, 0, 0);
});
const pencilImg = canvasOf(220, (x, s) => {
  const r = rng(19); x.lineCap = 'round';
  for (let i = 0; i < 1500; i++) {
    const px = r() * s, py = r() * s, l = 3 + r() * 8, a = -1.05 + (r() - 0.5) * 0.35;
    x.strokeStyle = `rgba(45,40,70,${0.04 + r() * 0.11})`; x.lineWidth = 0.5 + r() * 0.6;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke();
  }
});
const hatchImg = canvasOf(16, (x, s) => {
  x.strokeStyle = 'rgba(58,40,24,.62)'; x.lineWidth = 0.9;
  for (const k of [-16, 0, 16]) { x.beginPath(); x.moveTo(k, s); x.lineTo(k + s, 0); x.stroke(); }
});
const crossImg = canvasOf(16, (x, s) => {
  x.strokeStyle = 'rgba(58,40,24,.55)'; x.lineWidth = 0.8;
  for (const k of [-16, 0, 16]) { x.beginPath(); x.moveTo(k, s); x.lineTo(k + s, 0); x.stroke(); x.beginPath(); x.moveTo(k, 0); x.lineTo(k + s, s); x.stroke(); }
});
const washBase = canvasOf(256, (x) => {
  const r = rng(5);
  for (let i = 0; i < 80; i++) {
    const px = 128 + gauss(r) * 34, py = 128 + gauss(r) * 34, rad = 16 + r() * 50;
    const g = x.createRadialGradient(px, py, 0, px, py, rad);
    g.addColorStop(0, 'rgba(255,255,255,.075)'); g.addColorStop(0.7, 'rgba(255,255,255,.05)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(px - rad, py - rad, rad * 2, rad * 2);
  }
});
const WASH = new Map();
function washSprite(hex) {
  if (!WASH.has(hex)) WASH.set(hex, canvasOf(256, x => { x.drawImage(washBase, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = hex; x.fillRect(0, 0, 256, 256); }));
  return WASH.get(hex);
}
function makeGlow(rgb) {
  return canvasOf(64, x => {
    const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, `rgba(${rgb},1)`); g.addColorStop(0.18, `rgba(${rgb},.55)`); g.addColorStop(0.5, `rgba(${rgb},.12)`); g.addColorStop(1, `rgba(${rgb},0)`);
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  });
}
const GLOW_GOLD = makeGlow('255,214,130'), GLOW_PALE = makeGlow('225,238,235'), GLOW_WARM = makeGlow('255,226,180');

const PATS = new Map();
function pat(c, name) {
  let m = PATS.get(c); if (!m) PATS.set(c, m = {});
  if (!m[name]) {
    const src = { paper: paperImg, grain: grainImg, pencil: pencilImg, hatch: hatchImg, cross: crossImg }[name];
    const p = c.createPattern(src, 'repeat');
    const sc = { hatch: 0.45, cross: 0.45, pencil: 0.7 }[name];
    if (sc && p.setTransform) p.setTransform(new DOMMatrix().scale(sc));
    m[name] = p;
  }
  return m[name];
}
function resize() {
  DPR = Math.min(1.5, window.devicePixelRatio || 1) * RS;
  W = innerWidth; H = innerHeight; ASP = W / H;
  for (const c of [cv, off]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  const s = Math.min(W, H) / 1000 * DPR;
  BASE = [s, 0, W / 2 * DPR, H / 2 * DPR];
  PATS.clear(); for (const k in FIT) delete FIT[k];
}

/* ════════════ 筆法 ════════════ */
function tracePts(c, pts, move = true) {
  for (let i = 0; i < pts.length; i++) (i === 0 && move) ? c.moveTo(pts[0][0], pts[0][1]) : c.lineTo(pts[i][0], pts[i][1]);
}
function fillAll(c, style) { c.fillStyle = style; c.fillRect(-9000, -9000, 18000, 18000); }
function vgrad(c, y0, y1, stops) {
  const g = c.createLinearGradient(0, y0, 0, y1);
  stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s));
  return g;
}
function overlay(c, name, a, op = 'multiply') {
  c.save(); c.globalCompositeOperation = op; c.globalAlpha *= a; fillAll(c, pat(c, name)); c.restore();
}
/* 毛筆：寬度隨筆勢起落 */
function brush(c, pts, w, col, seed = 0, tip = 0.5) {
  const n = pts.length; if (n < 2) return;
  const A = [], B = [];
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[Math.max(0, i - 1)], r = pts[Math.min(n - 1, i + 1)];
    let dx = r[0] - q[0], dy = r[1] - q[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const t = i / (n - 1), prof = tip ? Math.pow(Math.sin(Math.PI * (0.04 + 0.92 * t)), tip) : 1;
    const ww = w * prof * (0.78 + 0.44 * vnoise(i * 0.35 + seed)) / 2;
    A.push([p[0] - dy * ww, p[1] + dx * ww]); B.push([p[0] + dy * ww, p[1] - dx * ww]);
  }
  c.beginPath(); tracePts(c, A); for (let i = n - 1; i >= 0; i--) c.lineTo(B[i][0], B[i][1]); c.closePath();
  c.fillStyle = col; c.fill();
}
/* 鉛筆：兩道略微錯開的細線 */
function pencil(c, pts, col, w, a, seed = 0) {
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = col;
  const g0 = c.globalAlpha;
  for (let pass = 0; pass < 2; pass++) {
    c.globalAlpha = g0 * a * (pass ? 0.5 : 1); c.lineWidth = w * (pass ? 0.6 : 1);
    c.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const j = (vnoise(i * 0.6 + seed * 3.1 + pass * 17) - 0.5) * w * 1.1 + (pass ? 0.5 : 0);
      const x = pts[i][0] + j, y = pts[i][1] + j * 0.6;
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.stroke();
  }
  c.restore();
}
/* 鋼筆：均勻的細墨線 */
function pen(c, pts, w = 1, col = '#3a2a1c') {
  c.beginPath(); tracePts(c, pts); c.strokeStyle = col; c.lineWidth = w; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke();
}
function wash(c, hex, x, y, w, h, a, rot = 0) {
  c.save(); c.translate(x, y); if (rot) c.rotate(rot); c.globalAlpha *= a; c.drawImage(washSprite(hex), -w / 2, -h / 2, w, h); c.restore();
}
function glow(c, img, x, y, r, a) {
  const g0 = c.globalAlpha; c.globalAlpha = g0 * a; c.drawImage(img, x - r, y - r, r * 2, r * 2); c.globalAlpha = g0;
}
function mist(c, y, h, hex, a) {
  c.fillStyle = vgrad(c, y - h, y + h, [rgba(hex, 0), rgba(hex, a), rgba(hex, 0)]); c.fillRect(-9000, y - h, 18000, h * 2);
}
function inkRange(c, o) {
  const x0 = o.x0 ?? -2600, x1 = o.x1 ?? 2600, st = o.step ?? 20;
  c.beginPath(); c.moveTo(x0, o.y + o.fade);
  const top = [];
  for (let x = x0; x <= x1; x += st) { const p = [x, o.y - o.amp * Math.pow(fbm(x / o.sc, o.seed), o.sharp ?? 1.5)]; top.push(p); c.lineTo(p[0], p[1]); }
  c.lineTo(x1, o.y + o.fade); c.closePath();
  const g = c.createLinearGradient(0, o.y - o.amp, 0, o.y + o.fade);
  g.addColorStop(0, rgba(o.hex, o.a)); g.addColorStop(0.45, rgba(o.hex, o.a * 0.9)); g.addColorStop(1, rgba(o.hex, 0));
  c.fillStyle = g; c.fill();
  return top;
}
function bezPts(p0, p1, p2, p3, n) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    out.push([u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
              u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]);
  }
  return out;
}
function star8(c, x, y, r, col, rot = 0) {
  c.beginPath();
  for (let k = 0; k < 16; k++) { const a = rot + k * Math.PI / 8, rr = k % 2 ? r * 0.38 : (k % 4 ? r * 0.72 : r); c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  c.closePath(); c.fillStyle = col; c.fill();
}
function sparkle(c, x, y, r, col) {
  c.beginPath();
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, rr = k % 2 ? r * 0.25 : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  c.closePath(); c.fillStyle = col; c.fill();
}
/* 幾米式的手繪小星星 */
function star5(c, x, y, r, col, t = 0, outline = '#8a6f3a') {
  const s = 1 + 0.12 * Math.sin(t * 2.2);
  c.beginPath();
  for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5 + Math.sin(t * 0.5) * 0.08, rr = (k % 2 ? r * 0.48 : r) * s; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  c.closePath(); c.fillStyle = col; c.fill(); c.strokeStyle = rgba(outline, 0.55); c.lineWidth = 0.6; c.stroke();
}
function fan(c, x, y, ang, spread, r, n, rgb, rayA, indent = 0) {
  if (r < 0.5) return;
  const pts = [];
  for (let k = 0; k <= n; k++) {
    const f = k / n, a = ang - spread + 2 * spread * f;
    const rr = r * (1 - indent * Math.pow(Math.cos((f - 0.5) * Math.PI), 2)) * (0.94 + 0.06 * Math.sin(k * 2.3));
    pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
  }
  const gr = c.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(${rgb},.6)`); gr.addColorStop(1, `rgba(${rgb},.16)`);
  c.beginPath(); c.moveTo(x, y); pts.forEach(p => c.lineTo(p[0], p[1])); c.closePath(); c.fillStyle = gr; c.fill();
  if (rayA > 0) {
    c.beginPath(); pts.forEach(p => { c.moveTo(x, y); c.lineTo(p[0], p[1]); });
    c.strokeStyle = `rgba(130,78,58,${rayA})`; c.lineWidth = 0.45; c.stroke();
    c.beginPath(); tracePts(c, pts); c.strokeStyle = `rgba(150,90,70,${rayA * 1.3})`; c.lineWidth = 0.55; c.stroke();
  }
}
function crescent(c, x, y, r, col) {
  c.save(); c.beginPath(); c.arc(x, y, r, 0, TAU); c.clip();
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.arc(x + r * 0.45, y - r * 0.2, r * 0.9, 0, TAU);
  c.fillStyle = col; c.fill('evenodd'); c.restore();
}

/* ════════════ 那一條線 ════════════ */
const N = 160;
const uAt = i => -1 + 2 * i / (N - 1);
function hAt(L, u) {
  const f = (u + 1) / 2 * (N - 1);
  if (f <= 0) return L[0]; if (f >= N - 1) return L[N - 1];
  const i = f | 0; return lerp(L[i], L[i + 1], f - i);
}
const place = (L, P, u) => [P.x + u * P.hw, P.y - hAt(L, u) * P.h];
function tang(L, P, u) { const a = place(L, P, u - 0.012), b = place(L, P, u + 0.012); return Math.atan2(b[1] - a[1], b[0] - a[0]); }
function linePts(L, P, step = 1, sy = 1) {
  const out = [];
  for (let i = 0; i < N; i += step) out.push([P.x + uAt(i) * P.hw, P.y - L[i] * P.h * sy]);
  if ((N - 1) % step) out.push([P.x + P.hw, P.y - L[N - 1] * P.h * sy]);
  return out;
}
function blur(L, passes = 3, r = 3) {
  let a = Float32Array.from(L);
  for (let p = 0; p < passes; p++) {
    const b = new Float32Array(N);
    for (let i = 0; i < N; i++) { let s = 0, n = 0; for (let k = -r; k <= r; k++) { const j = i + k; if (j >= 0 && j < N) { s += a[j]; n++; } } b[i] = s / n; }
    a = b;
  }
  return a;
}
const taperAt = i => Math.pow(Math.sin(Math.PI * i / (N - 1)), 0.45);
function normalize(L, lo, hi) {
  let m = 0; for (let i = 0; i < N; i++) m = Math.max(m, L[i]);
  if (m < 1e-3) { for (let i = 0; i < N; i++) L[i] = 0.5 * Math.sin(Math.PI * i / (N - 1)); return L; }
  const k = m > hi ? hi / m : m < lo ? lo / m : 1;
  for (let i = 0; i < N; i++) L[i] *= k;
  L[0] = L[N - 1] = 0; return L;
}
function resampleStroke(raw) {
  const pts = raw.slice().sort((a, b) => a[0] - b[0]);
  const x0 = pts[0][0], x1 = pts[pts.length - 1][0], L = new Float32Array(N);
  let j = 0;
  for (let i = 0; i < N; i++) {
    const x = x0 + (x1 - x0) * i / (N - 1);
    while (j < pts.length - 2 && pts[j + 1][0] < x) j++;
    const a = pts[j], b = pts[Math.min(j + 1, pts.length - 1)];
    const f = b[0] > a[0] ? clamp((x - a[0]) / (b[0] - a[0]), 0, 1) : 0;
    L[i] = Math.max(0, (RIDGE.y - lerp(a[1], b[1], f)) / RIDGE.h);
  }
  return { L, w: x1 - x0 };
}
function lineFromStroke(raw) {
  const { L, w } = resampleStroke(raw);
  if (w < 70) return null;
  const B = blur(L, 3, 3);
  for (let i = 0; i < N; i++) B[i] *= taperAt(i);
  return normalize(B, 0.38, 1);
}
function weather(L, seed) {
  const o = blur(L, 1, 2);
  for (let i = 0; i < N; i++) {
    const u = uAt(i), n = (vnoise(u * 3.4 + seed * 5.13) - 0.5) * 2 + (vnoise(u * 7.9 - seed * 2.7) - 0.5) * 0.8;
    o[i] = Math.max(0, o[i] * 0.97 + 0.085 * n * taperAt(i) * Math.sin(Math.PI * i / (N - 1)));
  }
  return normalize(o, 0.45, 1);
}
const DEFAULT_LINE = (() => {
  const L = new Float32Array(N);
  for (let i = 0; i < N; i++) { const u = uAt(i); L[i] = (0.55 + 0.25 * Math.sin(u * 5 + 1) + 0.15 * Math.sin(u * 11)) * taperAt(i); }
  return normalize(blur(L), 0.5, 0.9);
})();
function extrema(L) {
  const idx = [];
  for (let i = 3; i < N - 3; i++) {
    const isMax = L[i] > L[i - 1] && L[i] >= L[i + 1] && L[i] > 0.1;
    const isMin = L[i] < L[i - 1] && L[i] <= L[i + 1] && L[i] > 0.08;
    if ((isMax || isMin) && (!idx.length || i - idx[idx.length - 1].i > 5)) idx.push({ i, max: isMax });
  }
  let a = 0; while (a < N / 2 && L[a] < 0.07) a++;
  let b = N - 1; while (b > N / 2 && L[b] < 0.07) b--;
  if (!idx.length || idx[0].i - a > 5) idx.unshift({ i: a, max: false });
  if (b - idx[idx.length - 1].i > 5) idx.push({ i: b, max: false });
  return idx;
}

/* ════════════ 動物：背脊就是那條線（基線 y=0、半寬 75、高 85） ════════════ */
const AP = { x: 0, y: 0, hw: 75, h: 85 };
const REFL = 0.65;
const K12 = 1.4, AS = 2 / K12;

function bodyPath(c, L, step, belly) {
  const top = linePts(L, AP, step, 1);
  c.beginPath(); tracePts(c, top);
  if (belly) { const bot = linePts(L, AP, step, -belly); for (let i = bot.length - 1; i >= 0; i--) c.lineTo(bot[i][0], bot[i][1]); }
  else { c.lineTo(75, 0); c.lineTo(-75, 0); }
  c.closePath();
  return top;
}
const maxIdx = L => { let m = 0; for (let i = 1; i < N; i++) if (L[i] > L[m]) m = i; return m; };

  st => [{ river: 1, wind: 0.4 }, { wind: 1, pad: 0.3 }, { water: 0.8, swish: 0.5, wind: 0.4 }, { river: 0.8, grass: 0.5 }][st.ci],
  st => [{ pad: 1, water: 0.2 }, { pad: 0.8, wind: 0.4 }, { pad: 0.9, wind: 0.3 }, { pad: 1 }][st.ci],
];
function soundWeights(g, t, a) {
  const w = {};
  const add = (gg, k) => { const st = stageInfo(gg), m = SOUND_MAP[st.kind](st); for (const n in m) w[n] = (w[n] || 0) + m[n] * k; };
  if (t < 1e-4) add(g, 1); else { add(g, a); add(g + 1, 1 - a); }
  return w;
}
const DARK = [st => [0.1, 0.12, 0.2, 0.25][st.ci], st => [0.9, 1, 0.6, 0.5][st.ci], st => ({ fish: 0.3, cat: 0.9, whale: 0.45, dog: 0.15 })[st.anim],
  st => ({ fish: 0.75, cat: 0.95, whale: 0.25, dog: 0.2 })[st.anim], st => [0.35, 0.95, 0.3, 0.8][st.ci], st => [1, 0.6, 0.55, 0.95][st.ci]];
const TONES = [['#c9c0a8', '#d9d2dc', '#d2bc93', '#b8bfb2'], ['#20303a', '#2c3458', '#9a8890', '#6a5050'], ['#8fb8ad', '#3a3f6e', '#a8a68e', '#c9a86e'],
  ['#2a5552', '#2a2f5e', '#e2cda6', '#a8a070'], ['#b0c7b1', '#30356a', '#b8c4b0', '#6e6a3e'], ['#1a2a40', '#a88aa0', '#c8925e', '#1c2838']];
const TONE = g => { const st = stageInfo(g); return TONES[st.kind][st.ci]; };
function mixHex(a, b, t) {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16), m = (s) => Math.round(lerp((A >> s) & 255, (B >> s) & 255, t));
  return `rgb(${m(16)},${m(8)},${m(0)})`;
}
const darkOf = g => { const st = stageInfo(g); return DARK[st.kind](st); };

/* ════════════ 狀態、互動、引導 ════════════ */
const S0 = { z: 0, vz: 0, lines: null, stroke: null, drawn: false, morph: null, lastInput: 0, mouse: null, down: false, flash: {}, hotPrev: new Set(), lag: null, hover: 0, drawnAt: 0, shownScroll: 0 };
const guideEl = document.getElementById('guide'), hintEl = document.getElementById('hint'), title = document.getElementById('title'), sndBtn = document.getElementById('snd');
let guideKey = '';
function setGuide(k, text, mode) {
  if (guideKey === k) return; guideKey = k;
  guideEl.style.opacity = 0;
  setTimeout(() => { if (guideKey !== k) return; hintEl.textContent = text; guideEl.className = 'ui ' + (mode || ''); guideEl.style.opacity = text ? 0.78 : 0; }, 900);
}
function currentLine() {
  if (!S0.lines) return null;
  const cf = S0.z / PER, c = Math.floor(cf);
  while (S0.lines.length <= c + 1) S0.lines.push(weather(S0.lines[S0.lines.length - 1], S0.lines.length));
  const A = S0.lines[c], B = S0.lines[c + 1], f = sstep(0, 1, cf - c), out = new Float32Array(N);
  for (let i = 0; i < N; i++) out[i] = lerp(A[i], B[i], f);
  if (S0.morph) {
    const k = sstep(0, 1, (performance.now() - S0.morph.t0) / 900);
    for (let i = 0; i < N; i++) out[i] = lerp(S0.morph.from[i], out[i], k);
    if (k >= 1) S0.morph = null;
  }
  return out;
}
const toStage1 = e => app(inv(BASE), e.clientX * DPR, e.clientY * DPR);
cv.addEventListener('pointerdown', e => {
  SND.start(); S0.down = true; S0.mouse = [e.clientX * DPR, e.clientY * DPR];
  if (S0.drawn) return;
  const p = toStage1(e);
  if (!FRAMES[0].inside(p[0], Math.min(p[1], 229))) return;
  cv.setPointerCapture(e.pointerId);
  S0.stroke = [[p[0], Math.min(RIDGE.y, p[1])]];
  setGuide('none', '');
});
cv.addEventListener('pointermove', e => {
  S0.mouse = [e.clientX * DPR, e.clientY * DPR];
  if (!S0.stroke || S0.drawn) return;
  const p = toStage1(e);
  S0.stroke.push([clamp(p[0], -252, 252), clamp(p[1], RIDGE.y - RIDGE.h * 1.25, RIDGE.y)]);
});
cv.addEventListener('pointerleave', () => { S0.mouse = null; });
function finishStroke() {
  S0.down = false;
  if (!S0.stroke || S0.drawn) return;
  const L = lineFromStroke(S0.stroke);
  if (!L) { S0.stroke = null; guideKey = ''; setGuide('again', '再畫長一點　從左到右', 'draw'); return; }
  const from = resampleStroke(S0.stroke).L;
  S0.lines = [L]; S0.drawn = true; S0.stroke = null;
  if (guideKey === 'draw' || guideKey === 'again') setGuide('none', '');
  S0.morph = { from, t0: performance.now() };
  S0.lastInput = S0.drawnAt = performance.now();
}
cv.addEventListener('pointerup', finishStroke);
cv.addEventListener('pointercancel', finishStroke);
addEventListener('wheel', e => {
  e.preventDefault();
  if (!S0.drawn) return;
  const d = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 800 : 1);
  S0.vz = clamp(S0.vz + d * 0.000042, -0.02, 0.02);
  S0.lastInput = performance.now();
}, { passive: false });
addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') { SND.start(); SND.toggle(); return; }
  if (!S0.drawn) return;
  if (e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') { SND.start(); S0.vz = clamp(S0.vz + 0.0055, -0.02, 0.02); S0.lastInput = performance.now(); e.preventDefault(); }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') { S0.vz = clamp(S0.vz - 0.0055, -0.02, 0.02); S0.lastInput = performance.now(); e.preventDefault(); }
});
sndBtn.addEventListener('click', () => { SND.start(); SND.toggle(); });

/* 游標：畫線前是一支筆，畫完後是一圈會隨明暗變色的細環 */
function drawCursor(dark, dt) {
  if (!S0.mouse) return;
  const [mx, my] = S0.mouse, d = DPR;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const light = dark > 0.5, col = light ? '#efe6cf' : '#2b2a24';
  if (!S0.drawn) {
    ctx.save(); ctx.translate(mx, my); ctx.rotate(-0.62);
    const s = d * 0.95;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(3.6 * s, -6 * s, 5.2 * s, -15 * s, 0, -23 * s); ctx.bezierCurveTo(-5.2 * s, -15 * s, -3.6 * s, -6 * s, 0, 0);
    ctx.fillStyle = '#22201b'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -23 * s); ctx.lineTo(0, -48 * s); ctx.strokeStyle = 'rgba(95,70,40,.85)'; ctx.lineWidth = 2.4 * s; ctx.lineCap = 'round'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-2.4 * s, -24 * s); ctx.lineTo(2.4 * s, -24 * s); ctx.strokeStyle = '#c79b4a'; ctx.lineWidth = 1.2 * s; ctx.stroke();
    ctx.restore();
    if (S0.down) { ctx.beginPath(); ctx.arc(mx, my, 2.5 * d, 0, TAU); ctx.fillStyle = 'rgba(30,28,24,.5)'; ctx.fill(); }
    return;
  }
  if (!S0.lag) S0.lag = [mx, my];
  const k = 1 - Math.pow(0.001, dt);
  S0.lag[0] = lerp(S0.lag[0], mx, k); S0.lag[1] = lerp(S0.lag[1], my, k);
  S0.hover = lerp(S0.hover, S0.hotPrev.size ? 1 : 0, 1 - Math.pow(0.0005, dt));
  const r = (8 + 6 * S0.hover) * d;
  if (light) glow(ctx, GLOW_PALE, mx, my, r * 2.2, 0.18 + 0.25 * S0.hover);
  ctx.beginPath(); ctx.arc(S0.lag[0], S0.lag[1], r, 0, TAU); ctx.strokeStyle = S0.hover > 0.3 ? rgba('#e8c46a', 0.9) : rgba(col, 0.7); ctx.lineWidth = d; ctx.stroke();
  ctx.beginPath(); ctx.arc(mx, my, 1.7 * d, 0, TAU); ctx.fillStyle = rgba(col, 0.9); ctx.fill();
}

/* ════════════ 主迴圈 ════════════ */
let last = performance.now();
const env = { time: 0, hot: [], flash: {}, ext: [] };
const PERF = { n: 0, sum: 0 };
function frame(now) {
  const raw = now - last, dt = Math.min(0.05, raw / 1000); last = now;
  // 卡的時候降一點解析度保住流暢，順的時候再拉回來
  PERF.n++; PERF.sum += raw;
  if (PERF.n === 40) {
    const avg = PERF.sum / PERF.n; PERF.n = PERF.sum = 0;
    const nrs = avg > 30 && RS > 0.55 ? RS * 0.85 : avg < 18 && RS < 1 ? Math.min(1, RS / 0.85) : RS;
    if (nrs !== RS) { RS = nrs; resize(); }
  }
  env.time = now / 1000;
  if (S0.drawn && !window.__freeze) {
    const f = S0.z - Math.floor(S0.z), slow = 1 - 0.5 * Math.exp(-((f / 0.07) ** 2)) - 0.5 * Math.exp(-(((1 - f) / 0.07) ** 2));
    S0.z = Math.max(0, S0.z + S0.vz * slow * dt * 60);
    S0.vz *= Math.pow(0.92, dt * 60);
    const idle = now - S0.lastInput;
    if (idle > 12000 && Math.abs(S0.vz) < 0.001) S0.z += 0.009 * dt;
    if (S0.z < 0.2 && now - S0.drawnAt > 1800 && (S0.shownScroll === 0 || (idle > 22000 && S0.shownScroll === 1))) {
      S0.shownScroll++; guideKey = ''; setGuide('scroll' + S0.shownScroll, '轉動滾輪，或按空白鍵　往後退', 'scroll');
    }
    if (S0.z > 0.25 && guideKey.startsWith('scroll')) setGuide('none', '');
  }
  if (!S0.drawn && !S0.stroke && guideKey === '' && now > 1200) setGuide('draw', '在窗裡　從左到右　畫一道山', 'draw');
  const gp = (env.time - 1.6) % 7.5;
  env.ghost = (!S0.drawn && !S0.stroke && env.time > 1.6 && !window.__noGhost) ? sstep(0, 0.4, gp) * (1 - sstep(3.4, 4.2, gp)) : 0;
  env.ghostP = sstep(0.1, 2.9, gp);
  env.shownLine = currentLine();
  env.ext = env.shownLine ? extrema(env.shownLine) : [];
  env.stroke = S0.stroke; env.mouse = S0.mouse; env.hot = []; env.flash = S0.flash;

  const g = Math.floor(S0.z), t = S0.z - g;
  const a = 1 - sstep(0.3, 0.7, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  if (t < 1e-4) draw(ctx, g, BASE);
  else {
    TRANS[stageInfo(g).kind](g, t);
    const ta = TONE(g), tb = TONE(g + 1), k = Math.pow(Math.sin(Math.PI * t), 1.2) * 0.32;
    if (k > 0.01) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'color'; ctx.globalAlpha = k; ctx.fillStyle = mixHex(ta, tb, t); ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore(); }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'overlay'; ctx.fillStyle = pat(ctx, 'grain'); ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.globalCompositeOperation = 'source-over';
  const vg = ctx.createRadialGradient(cv.width / 2, cv.height / 2, Math.min(cv.width, cv.height) * 0.35, cv.width / 2, cv.height / 2, Math.hypot(cv.width, cv.height) * 0.62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,8,5,.26)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, cv.width, cv.height);

  for (const k in S0.flash) { S0.flash[k] -= dt * 0.8; if (S0.flash[k] <= 0) delete S0.flash[k]; }
  const touching = new Set();
  if (S0.mouse && S0.drawn) for (const h of env.hot) {
    const p = app(h.S, h.x, h.y);
    if (Math.hypot(p[0] - S0.mouse[0], p[1] - S0.mouse[1]) < 22 * DPR) {
      touching.add(h.id);
      if (!S0.hotPrev.has(h.id)) { S0.flash[h.id] = 1; SND.ping(Math.abs(h.x | 0) % 7 + (h.id[0] === 'c' ? 0 : 3)); }
    }
  }
  S0.hotPrev = touching;

  const dark = t < 1e-4 ? darkOf(g) : lerp(darkOf(g + 1), darkOf(g), a);
  drawCursor(dark, dt);
  const col = dark > 0.5 ? '#ddd4bf' : '#4a4436';
  title.style.color = guideEl.style.color = sndBtn.style.color = col;
  SND.update(soundWeights(g, t, a), env.time, dt);
  requestAnimationFrame(frame);
}
resize();
addEventListener('resize', resize);
requestAnimationFrame(frame);

window.__shanhai = {
  state: S0,
  draw(pts) { S0.stroke = pts; finishStroke(); S0.morph = null; },
  setZ(z) { S0.z = z; S0.vz = 0; },
};
})();
</script>
