<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>看山似山</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#ebe4d4}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none}
  .ui{position:fixed;font-family:'Noto Serif TC','Songti TC','PMingLiU',serif;font-weight:300;
      letter-spacing:.42em;user-select:none;transition:color 1.6s ease,opacity 1.6s ease;color:#4a4436}
  #title{top:30px;left:36px;font-size:13px;opacity:.5;pointer-events:none}
  #hint{left:0;right:0;bottom:44px;text-align:center;font-size:15px;opacity:0;pointer-events:none}
  #snd{right:30px;bottom:30px;font-size:13px;opacity:.45;cursor:pointer;background:none;border:0;padding:6px 4px 6px 10px}
  #snd:hover{opacity:.85}
  #snd.off{text-decoration:line-through}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title" class="ui">看山　似山</div>
<div id="hint" class="ui"></div>
<button id="snd" class="ui" title="聲音 (M)">聲</button>
<script>
(() => {
'use strict';

/* ───────────── 基本工具 ───────────── */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hash1 = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const vnoise = x => { const i = Math.floor(x), f = x - i; return lerp(hash1(i), hash1(i + 1), f * f * (3 - 2 * f)); };
const gauss = r => Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(TAU * r());

/* 相似變換：z → m·z + t，m 為複數（旋轉＋縮放），以陣列 [mr, mi, tx, ty] 表示 */
const mul = (A, B) => [
  A[0] * B[0] - A[1] * B[1], A[0] * B[1] + A[1] * B[0],
  A[0] * B[2] - A[1] * B[3] + A[2], A[1] * B[2] + A[0] * B[3] + A[3]];
const inv = S => {
  const d = S[0] * S[0] + S[1] * S[1], a = S[0] / d, b = -S[1] / d;
  return [a, b, -(a * S[2] - b * S[3]), -(b * S[2] + a * S[3])];
};
const app = (S, x, y) => [S[0] * x - S[1] * y + S[2], S[1] * x + S[0] * y + S[3]];
const setT = (c, S) => c.setTransform(S[0], S[1], -S[1], S[0], S[2], S[3]);
const simFrom = (cx, cy, th, K) => [Math.cos(th) / K, Math.sin(th) / K, cx, cy];
const scaleOf = S => Math.hypot(S[0], S[1]);

/* 門戶 T 把上一層整個畫面放進下一層的某處；鏡頭沿 T 的不動點做連續的對數縮放 */
function camOf(T, t) {
  const mr = T[0], mi = T[1];
  const dr = 1 - mr, di = -mi, dd = dr * dr + di * di;
  const Fr = (T[2] * dr + T[3] * di) / dd, Fi = (T[3] * dr - T[2] * di) / dd;
  const e = -(1 - t);
  const wm = Math.pow(Math.hypot(mr, mi), e), wa = Math.atan2(mi, mr) * e;
  const wr = wm * Math.cos(wa), wi = wm * Math.sin(wa);
  return [wr, wi, Fr - (wr * Fr - wi * Fi), Fi - (wr * Fi + wi * Fr)];
}

/* ───────────── 畫布 ───────────── */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'), octx = off.getContext('2d');
let W, H, DPR, ASP, BASE;
const PAPER = new Map();
let grainPat = null;

function makePaper() {
  const s = 384, c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d'), r = rng(7);
  x.fillStyle = '#ebe4d4'; x.fillRect(0, 0, s, s);
  const img = x.getImageData(0, 0, s, s), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (r() - 0.5) * 14;
    d[i] += n; d[i + 1] += n; d[i + 2] += n * 0.8;
  }
  x.putImageData(img, 0, 0);
  for (let i = 0; i < 90; i++) {
    x.strokeStyle = `rgba(120,100,70,${0.025 + r() * 0.04})`; x.lineWidth = 0.6;
    const px = r() * s, py = r() * s, a = r() * TAU, l = 6 + r() * 26;
    x.beginPath(); x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(a) * l * 0.5 + r() * 4, py + Math.sin(a) * l * 0.5, px + Math.cos(a) * l, py + Math.sin(a) * l);
    x.stroke();
  }
  for (let i = 0; i < 14; i++) {
    const px = r() * s, py = r() * s, rr = 20 + r() * 60;
    const g = x.createRadialGradient(px, py, 0, px, py, rr);
    g.addColorStop(0, 'rgba(150,120,70,.05)'); g.addColorStop(1, 'rgba(150,120,70,0)');
    x.fillStyle = g; x.fillRect(px - rr, py - rr, rr * 2, rr * 2);
  }
  return c;
}
function makeGrain() {
  const s = 256, c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d'), img = x.createImageData(s, s), d = img.data, r = rng(3);
  for (let i = 0; i < d.length; i += 4) { const v = r() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 22; }
  x.putImageData(img, 0, 0);
  return c;
}
const paperImg = makePaper(), grainImg = makeGrain();
function paperFor(c) { if (!PAPER.has(c)) PAPER.set(c, c.createPattern(paperImg, 'repeat')); return PAPER.get(c); }

function makeGlow(rgb) {
  const s = 64, c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, `rgba(${rgb},1)`); g.addColorStop(0.18, `rgba(${rgb},.55)`);
  g.addColorStop(0.5, `rgba(${rgb},.12)`); g.addColorStop(1, `rgba(${rgb},0)`);
  x.fillStyle = g; x.fillRect(0, 0, s, s); return c;
}
const GLOW_GOLD = makeGlow('255,214,130'), GLOW_PALE = makeGlow('225,238,235'), GLOW_WARM = makeGlow('255,190,120');

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; ASP = W / H;
  for (const c of [cv, off]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  const s = Math.min(W, H) / 1000 * DPR;
  BASE = [s, 0, W / 2 * DPR, H / 2 * DPR];
  grainPat = ctx.createPattern(grainImg, 'repeat');
  PAPER.clear();
}
addEventListener('resize', resize);
resize();

/* ───────────── 那一條線 ───────────── */
const N = 160;
const uAt = i => -1 + 2 * i / (N - 1);
function hAt(L, u) {
  const f = (u + 1) / 2 * (N - 1);
  if (f <= 0) return L[0];
  if (f >= N - 1) return L[N - 1];
  const i = f | 0; return lerp(L[i], L[i + 1], f - i);
}
const place = (L, P, u) => [P.x + u * P.hw, P.y - hAt(L, u) * P.h];
function tang(L, P, u) {
  const a = place(L, P, u - 0.012), b = place(L, P, u + 0.012);
  return Math.atan2(b[1] - a[1], b[0] - a[0]);
}
function linePts(L, P, step = 1, sy = 1) {
  const out = [];
  for (let i = 0; i < N; i += step) out.push([P.x + uAt(i) * P.hw, P.y - L[i] * P.h * sy]);
  if ((N - 1) % step) out.push([P.x + P.hw, P.y - L[N - 1] * P.h * sy]);
  return out;
}
function tracePts(c, pts, move = true) {
  for (let i = 0; i < pts.length; i++) {
    if (i === 0 && move) c.moveTo(pts[0][0], pts[0][1]); else c.lineTo(pts[i][0], pts[i][1]);
  }
}
function blur(L, passes = 3, r = 3) {
  let a = Float32Array.from(L);
  for (let p = 0; p < passes; p++) {
    const b = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      let s = 0, n = 0;
      for (let k = -r; k <= r; k++) { const j = i + k; if (j >= 0 && j < N) { s += a[j]; n++; } }
      b[i] = s / n;
    }
    a = b;
  }
  return a;
}
const taperAt = i => Math.pow(Math.sin(Math.PI * i / (N - 1)), 0.45);
function normalize(L, lo, hi) {
  let m = 0; for (let i = 0; i < N; i++) m = Math.max(m, L[i]);
  if (m < 1e-3) { for (let i = 0; i < N; i++) L[i] = 0.5 * Math.sin(Math.PI * i / (N - 1)); return L; }
  const k = m > hi ? hi / m : m < lo ? lo / m : 1;
  for (let i = 0; i < N; i++) L[i] *= k;
  L[0] = L[N - 1] = 0;
  return L;
}
function lineFromStroke(raw) {
  const pts = raw.slice().sort((a, b) => a[0] - b[0]);
  const x0 = pts[0][0], x1 = pts[pts.length - 1][0];
  if (x1 - x0 < 70) return null;
  const L = new Float32Array(N);
  let j = 0;
  for (let i = 0; i < N; i++) {
    const x = x0 + (x1 - x0) * i / (N - 1);
    while (j < pts.length - 2 && pts[j + 1][0] < x) j++;
    const a = pts[j], b = pts[Math.min(j + 1, pts.length - 1)];
    const f = b[0] > a[0] ? clamp((x - a[0]) / (b[0] - a[0]), 0, 1) : 0;
    L[i] = Math.max(0, (RIDGE.y - lerp(a[1], b[1], f)) / RIDGE.h);
  }
  const B = blur(L, 3, 3);
  for (let i = 0; i < N; i++) B[i] *= taperAt(i);
  return normalize(B, 0.38, 1);
}
function weather(L, seed) {
  const o = blur(L, 1, 2);
  for (let i = 0; i < N; i++) {
    const u = uAt(i);
    const n = (vnoise(u * 3.4 + seed * 5.13) - 0.5) * 2 + (vnoise(u * 7.9 - seed * 2.7) - 0.5) * 0.8;
    o[i] = Math.max(0, o[i] * 0.97 + 0.085 * n * taperAt(i) * Math.sin(Math.PI * i / (N - 1)));
  }
  return normalize(o, 0.45, 1);
}
const DEFAULT_LINE = (() => {
  const L = new Float32Array(N);
  for (let i = 0; i < N; i++) { const u = uAt(i); L[i] = (0.55 + 0.25 * Math.sin(u * 5 + 1) + 0.15 * Math.sin(u * 11)) * taperAt(i); }
  return normalize(blur(L), 0.5, 0.9);
})();
function extrema(L) {
  const idx = [];
  for (let i = 3; i < N - 3; i++) {
    const isMax = L[i] > L[i - 1] && L[i] >= L[i + 1] && L[i] > 0.1;
    const isMin = L[i] < L[i - 1] && L[i] <= L[i + 1] && L[i] > 0.08;
    if ((isMax || isMin) && (!idx.length || i - idx[idx.length - 1].i > 5)) idx.push({ i, max: isMax });
  }
  let a = 0; while (a < N / 2 && L[a] < 0.07) a++;
  let b = N - 1; while (b > N / 2 && L[b] < 0.07) b--;
  if (!idx.length || idx[0].i - a > 5) idx.unshift({ i: a, max: false });
  if (b - idx[idx.length - 1].i > 5) idx.push({ i: b, max: false });
  return idx;
}

/* ───────────── 隨機但固定的群體 ───────────── */
const R = rng(20260929);
const DUST = Array.from({ length: 820 }, () => ({ x: (R() * 2 - 1) * 1600, y: -1000 + R() * 1800, s: 0.5 + R() * R() * 2.4, p: R() * TAU, f: 0.4 + R() * 2 }));
const MILKY = Array.from({ length: 950 }, () => ({ u: R() * 2.4 - 1.2, o: gauss(R), s: 0.4 + R() * R() * 1.8, p: R() * TAU }));
const GLYPHS = [[-640, -330, 16, 1], [560, -380, 12, 0], [-300, -420, 9, 0], [760, -120, 10, 0], [-820, -60, 8, 0], [250, -300, 7, 0]];
const SCHOOL = Array.from({ length: 58 }, () => ({ u: R() * 2 - 1, o: gauss(R) * 48, sp: 0.012 + R() * 0.02, sc: 0.75 + R() * 0.45, ph: R() * TAU }));
const FLIES = Array.from({ length: 240 }, () => ({ u: R() * 2 - 1, o: gauss(R) * 30, ph: R() * TAU, sp: 0.5 + R() * 1.5, r: 6 + R() * 7 }));
const CRANES = Array.from({ length: 40 }, () => ({ u: R() * 2 - 1, o: gauss(R) * 26, ph: R() * TAU, sc: 0.8 + R() * 0.4 }));
const DEER = Array.from({ length: 17 }, (_, k) => ({ u: -0.85 + 1.7 * (k + R() * 0.7) / 17, graze: R() < 0.4, sc: 0.8 + R() * 0.35, flip: R() < 0.5, antler: R() < 0.35, ph: R() * TAU }));
const MOTES = Array.from({ length: 140 }, () => ({ x: (R() * 2 - 1) * 1100, y: (R() * 2 - 1) * 700, s: 0.6 + R() * 1.6, ph: R() * TAU, sp: 4 + R() * 10 }));
const STREAKS = Array.from({ length: 300 }, () => ({ u: R() * 2 - 1, o: gauss(R) * 0.45, sp: 0.01 + R() * 0.025, len: 0.006 + R() * 0.02 }));
const TREES = Array.from({ length: 220 }, () => ({ u: R() * 2 - 1, d: (R() < 0.5 ? -1 : 1) * (50 + R() * R() * 260), s: 0.6 + R() * 0.8 }));
const TUFTS = Array.from({ length: 120 }, (_, k) => ({ x: -1300 + k * 22 + R() * 14, h: 6 + R() * 16, lean: (R() - 0.5) * 0.8 }));
const WEEDS = [[-560, 520, 330, -0.08], [-470, 520, 250, 0.05], [-640, 520, 200, 0.1], [520, 520, 300, 0.06], [610, 520, 230, -0.07], [440, 520, 170, 0.02]];

/* ───────────── 共用小圖形 ───────────── */
const GOLD = '#c79b4a', INK = '#1d2a2c', RIM = 'rgba(222,208,168,.85)';
function star8(c, x, y, r, col, rot = 0) {
  c.beginPath();
  for (let k = 0; k < 16; k++) {
    const a = rot + k * Math.PI / 8, rr = k % 2 ? r * 0.38 : (k % 4 ? r * 0.72 : r);
    c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  c.closePath(); c.fillStyle = col; c.fill();
}
function sparkle(c, x, y, r, col) {
  c.beginPath();
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, rr = k % 2 ? r * 0.25 : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  c.closePath(); c.fillStyle = col; c.fill();
}
function glow(c, img, x, y, r, a) {
  const g0 = c.globalAlpha; c.globalAlpha = g0 * a; c.drawImage(img, x - r, y - r, r * 2, r * 2); c.globalAlpha = g0;
}
function fillAll(c, style) { c.fillStyle = style; c.fillRect(-9000, -9000, 18000, 18000); }
function vgrad(c, y0, y1, stops) {
  const g = c.createLinearGradient(0, y0, 0, y1);
  stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s));
  return g;
}

/* ───────────── 動物（都以 基線 y=0、半寬 75、高 85 的那條線為背） ───────────── */
const AP = { x: 0, y: 0, hw: 75, h: 85 };
const REFL = 0.65;
const K12 = 1.4, AS = 2 / K12; // 山到背脊只退 1.4 倍，動物在第二層以 AS 倍呈現

function bodyPath(c, L, step, belly) {
  const top = linePts(L, AP, step, 1);
  c.beginPath(); tracePts(c, top);
  if (belly) { const bot = linePts(L, AP, step, -belly); for (let i = bot.length - 1; i >= 0; i--) c.lineTo(bot[i][0], bot[i][1]); }
  else { c.lineTo(75, 0); c.lineTo(-75, 0); }
  c.closePath();
  return top;
}
function rimLine(c, top, w = 1.3) {
  c.beginPath(); tracePts(c, top); c.strokeStyle = RIM; c.lineWidth = w; c.lineJoin = 'round'; c.stroke();
}
function goldSpots(c, L, env, dy = 4) {
  for (const e of env.ext) if (e.max) {
    const u = uAt(e.i); sparkle(c, u * 75, -L[e.i] * 85 + dy, 3.2, '#e2bb62');
  }
}

function drawFish(c, L, o, env) {
  const g = o.grow, t = env.time, lite = o.lite, st = lite ? 8 : 1;
  // 尾鰭
  if (g > 0.01) {
    c.save(); c.translate(-73, 0); c.rotate(Math.sin(t * 2.1 + o.ph) * 0.16);
    const r = 48 * g;
    c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, r, Math.PI - 0.6, Math.PI + 0.6); c.closePath();
    c.fillStyle = 'rgba(232,168,142,.34)'; c.fill();
    if (!lite) {
      c.beginPath();
      for (let k = 0; k <= 9; k++) { const a = Math.PI - 0.6 + 1.2 * k / 9; c.moveTo(0, 0); c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      c.strokeStyle = 'rgba(244,218,196,.6)'; c.lineWidth = 0.7; c.stroke();
    }
    c.restore();
  }
  const top = bodyPath(c, L, st, REFL);
  c.fillStyle = vgrad(c, -85, 56, ['#131f25', '#1b2c32', '#34504f']); c.fill();
  if (!lite) {
    c.save(); c.clip();
    c.strokeStyle = 'rgba(214,196,150,.12)'; c.lineWidth = 0.8;
    for (let y = -84; y < 60; y += 9) for (let x = -72; x < 76; x += 11) {
      c.beginPath(); c.arc(x + ((y / 9) & 1) * 5.5, y, 6, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
    }
    c.restore();
    c.beginPath(); c.moveTo(-70, 0); c.lineTo(66, 0);
    c.strokeStyle = 'rgba(214,180,110,.35)'; c.lineWidth = 0.8; c.setLineDash([3, 4]); c.stroke(); c.setLineDash([]);
  }
  rimLine(c, top, lite ? 1.6 : 1.3);
  if (g > 0.01) {
    c.globalAlpha = g;
    const he = hAt(L, 0.8) * 85;
    // 胸鰭
    c.save(); c.translate(28, he * 0.2 + 6); c.rotate(0.9 + Math.sin(t * 1.7 + o.ph) * 0.12);
    c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 22 * g, -0.4, 0.4); c.closePath();
    c.fillStyle = 'rgba(232,168,142,.32)'; c.fill(); c.restore();
    // 眼與鰓
    const ex = 58, ey = -he * 0.3;
    c.beginPath(); c.arc(ex, ey, 3.6, 0, TAU); c.fillStyle = '#e9dfc6'; c.fill();
    c.beginPath(); c.arc(ex + 0.6, ey, 1.8, 0, TAU); c.fillStyle = '#0c1214'; c.fill();
    if (!lite) {
      c.beginPath(); c.arc(44, 0, he * 0.55 + 8, -1.1, 1.1);
      c.strokeStyle = 'rgba(222,208,168,.45)'; c.lineWidth = 0.9; c.stroke();
    }
    c.globalAlpha = 1;
  }
  if (!lite) goldSpots(c, L, env);
}

function drawWhale(c, L, o, env) {
  const g = o.grow, t = env.time, lite = o.lite, st = lite ? 8 : 1;
  const hf = hAt(L, 0.72) * 85, ry = Math.max(16, hf * (1 + REFL) / 2), cy = -hf * (1 - REFL) / 2;
  const grad = vgrad(c, -85, 60, ['#1d313b', '#2a4550', '#5b7b82']);
  if (g > 0.01) {
    c.save(); c.translate(-74, 0); c.rotate(Math.sin(t * 0.9) * 0.1);
    c.beginPath(); c.moveTo(0, -5); c.lineTo(-30 * g, -3); c.quadraticCurveTo(-52 * g, -36 * g, -70 * g, -30 * g);
    c.quadraticCurveTo(-56 * g, -6, -42 * g, 0); c.quadraticCurveTo(-56 * g, 6, -70 * g, 30 * g);
    c.quadraticCurveTo(-52 * g, 36 * g, -30 * g, 3); c.lineTo(0, 5); c.closePath();
    c.fillStyle = '#233a44'; c.fill(); c.restore();
  }
  const top = bodyPath(c, L, st, REFL);
  c.fillStyle = grad; c.fill();
  if (g > 0.01) {
    c.globalAlpha = g;
    c.beginPath(); c.ellipse(60, cy, 34 * g, ry, 0, 0, TAU); c.fillStyle = grad; c.fill();
    c.globalAlpha = 1;
  }
  if (!lite) {
    c.save(); bodyPath(c, L, 2, REFL); c.clip();
    c.strokeStyle = 'rgba(210,225,220,.18)'; c.lineWidth = 0.8;
    for (let k = 1; k < 6; k++) {
      c.beginPath();
      for (let u = -0.1; u <= 0.95; u += 0.05) { const y = hAt(L, u) * 85 * REFL - k * 4.5; u === -0.1 ? c.moveTo(u * 75, y) : c.lineTo(u * 75, y); }
      c.stroke();
    }
    c.restore();
  }
  rimLine(c, top, lite ? 1.6 : 1.3);

  if (Math.abs(p[0]) > WIN.hw || p[1] > WIN.bot || p[1] < WIN.top - WIN.hw) return;
  cv.setPointerCapture(e.pointerId);
  S0.stroke = [[p[0], Math.min(RIDGE.y, p[1])]];
});
cv.addEventListener('pointermove', e => {
  S0.mouse = [e.clientX * DPR, e.clientY * DPR];
  if (!S0.stroke || S0.drawn) return;
  const p = toStage1(e);
  S0.stroke.push([clamp(p[0], -WIN.hw + 8, WIN.hw - 8), clamp(p[1], RIDGE.y - RIDGE.h * 1.25, RIDGE.y)]);
});
cv.addEventListener('pointerleave', () => { S0.mouse = null; });
function finishStroke() {
  if (!S0.stroke || S0.drawn) return;
  const L = lineFromStroke(S0.stroke);
  if (!L) { S0.stroke = null; setHint('again', '再畫長一點，從左到右'); return; }
  // 從手繪的樣子，慢慢收成一道山
  const pts = S0.stroke.slice().sort((a, b) => a[0] - b[0]), from = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const x = uAt(i) * RIDGE.hw, xs = lerp(pts[0][0], pts[pts.length - 1][0], i / (N - 1));
    let j = 0; while (j < pts.length - 1 && pts[j + 1][0] < xs) j++;
    from[i] = Math.max(0, (RIDGE.y - pts[j][1]) / RIDGE.h); void x;
  }
  S0.lines = [L]; S0.drawn = true; S0.stroke = null;
  setHint('none', '');
  S0.morph = { from, t0: performance.now() };
  S0.lastInput = performance.now();
  setTimeout(() => { if (S0.z < 0.05) setHint('scroll', '轉動滾輪　往後退'); }, 2200);
}
cv.addEventListener('pointerup', finishStroke);
cv.addEventListener('pointercancel', finishStroke);
addEventListener('wheel', e => {
  e.preventDefault();
  if (!S0.drawn) return;
  const d = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 800 : 1);
  S0.vz = clamp(S0.vz + d * 0.00007, -0.03, 0.03);
  S0.lastInput = performance.now();
}, { passive: false });
addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') SND.toggle();
  if (!S0.drawn) return;
  if (e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') { S0.vz = clamp(S0.vz + 0.008, -0.03, 0.03); S0.lastInput = performance.now(); e.preventDefault(); }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') { S0.vz = clamp(S0.vz - 0.008, -0.03, 0.03); S0.lastInput = performance.now(); e.preventDefault(); }
});
sndBtn.addEventListener('click', () => { SND.start(); SND.toggle(); });

/* ───────────── 主迴圈 ───────────── */
const DARK = [0.1, { fish: 0.35, cat: 0.95, whale: 0.7, dog: 0.15 }, { fish: 0.6, cat: 0.95, whale: 0.3, dog: 0.2 }, { fish: 0.9, cat: 1, whale: 0.8, dog: 0.6 }, 1];
const darkOf = g => { const s = stageInfo(g), d = DARK[s.kind]; return typeof d === 'number' ? d : d[s.anim]; };
let last = performance.now();
const env = { time: 0, hot: [], flash: {}, ext: [] };

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  env.time = now / 1000;
  if (S0.drawn && !window.__freeze) {
    const f = S0.z - Math.floor(S0.z);
    const slow = 1 - 0.55 * Math.exp(-(((f - 0.42) / 0.16) ** 2));
    S0.z = Math.max(0, S0.z + S0.vz * slow * dt * 60);
    S0.vz *= Math.pow(0.92, dt * 60);
    if (now - S0.lastInput > 9000 && Math.abs(S0.vz) < 0.001) S0.z += 0.011 * dt;
    if (S0.z > 0.25 && hintKey === 'scroll') setHint('none', '');
  }
  if (!S0.drawn && !S0.stroke && hintKey === '' && now > 900) setHint('draw', '在窗裡　畫一道山');
  env.K51 = Math.max(4, 500 * ASP / 245);
  env.shownLine = currentLine();
  env.ext = env.shownLine ? extrema(env.shownLine) : [];
  env.stroke = S0.stroke;
  env.mouse = S0.mouse;
  env.hot = []; env.flash = S0.flash;

  const g = Math.floor(S0.z), t = S0.z - g;
  let a = 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (t < 1e-4) drawStage(ctx, g, BASE, env, 'solo', 0);
  else {
    const T = portalT(stageInfo(g).kind, stageInfo(g).cycle, env);
    const Sn = mul(BASE, camOf(T, t));
    drawStage(ctx, g + 1, Sn, env, 'next', t);
    const hotNext = env.hot; env.hot = [];
    octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, off.width, off.height);
    drawStage(octx, g, mul(Sn, T), env, 'prev', t);
    a = 1 - sstep(0.06, 0.72, t);
    if (a < 0.5) env.hot = hotNext;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = a; ctx.drawImage(off, 0, 0); ctx.globalAlpha = 1;
  }
  // 紙紋與暗角
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'overlay'; ctx.fillStyle = grainPat; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.globalCompositeOperation = 'source-over';
  const vg = ctx.createRadialGradient(cv.width / 2, cv.height / 2, Math.min(cv.width, cv.height) * 0.35, cv.width / 2, cv.height / 2, Math.hypot(cv.width, cv.height) * 0.62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,8,5,.28)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, cv.width, cv.height);

  // 星星被滑鼠碰到時會響
  for (const k in S0.flash) { S0.flash[k] -= dt * 0.8; if (S0.flash[k] <= 0) delete S0.flash[k]; }
  const touching = new Set();
  if (S0.mouse && S0.drawn) {
    for (const h of env.hot) {
      const p = app(h.S, h.x, h.y);
      if (Math.hypot(p[0] - S0.mouse[0], p[1] - S0.mouse[1]) < 22 * DPR) {
        touching.add(h.id);
        if (!S0.hotPrev.has(h.id)) { S0.flash[h.id] = 1; SND.ping(Math.abs(h.x | 0) % 7 + (h.id[0] === 'c' ? 0 : 3)); }
      }
    }
  }
  S0.hotPrev = touching;

  const dark = t < 1e-4 ? darkOf(g) : lerp(darkOf(g + 1), darkOf(g), a);
  const col = dark > 0.5 ? '#d8d0bc' : '#4a4436';
  title.style.color = hint.style.color = sndBtn.style.color = col;
  SND.update(soundWeights(g, t, a), env.time, dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* 測試用掛鉤 */
window.__shanhai = {
  state: S0,
  draw(pts) { S0.stroke = pts; finishStroke(); S0.morph = null; },
  setZ(z) { S0.z = z; S0.vz = 0; },
};
})();
</script>
